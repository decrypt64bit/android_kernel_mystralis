name: Build Mystralis Kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release after a successful build"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_CODENAME: "RMX1971"
  KERNEL_DEFCONFIG: "sdm670-perf_defconfig"
  KERNEL_IMAGE: "Image.gz-dtb"
  KERNEL_NAME: "Mystralis"
  KERNEL_VARIANT: "mystralis"
  PROTON_CLANG_REPO: "https://github.com/kdrag0n/proton-clang.git"
  ANYKERNEL_REPO: "https://github.com/dain09/AnyKernel3.git"
  # Hookless KSU driver (backslashxx/KernelSU). Pinned to v3.3.0-52 - the
  # newest commit on the hookless line (KSU_TAMPER_SYSCALL_TABLE, no KPROBES
  # dependency) and the exact repo state the manager APK
  # KernelSU_v3.3.0-52_32653 was built from. Driver reports KSU_VERSION=32651.
  KERNELSU_SETUP: "https://raw.githubusercontent.com/dain09/KernelSU/refs/heads/hookless/kernel/setup.sh"
  KERNELSU_SETUP_BRANCH: v3.3.0-52
  KBUILD_BUILD_USER: "@decrypt64bit"
  KBUILD_BUILD_HOST: "ubuntu-24.04"

jobs:
  build:
    name: Build Kernel Artifacts (${{ matrix.variant.kernel_version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      # Without this, one variant failing cancels the other, and since the
      # release job needs the whole matrix it would never publish.
      fail-fast: false
      matrix:
        variant:
          - kernel_version: "ascension-SLMK"
          - kernel_version: "ascension"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          # Shallow checkout is enough (no rebase); speeds up CI a lot.
          fetch-depth: 1

      - name: Switch non-SLMK variant to classic LMK
        if: ${{ matrix.variant.kernel_version == 'ascension' }}
        run: |
          # Don't rebase SLMK commits away (conflict-prone); just disable
          # the driver and enable the self-starting classic lowmemorykiller
          # (built-in adj/minfree defaults) so this variant keeps a working LMK.
          ./scripts/config --file arch/arm64/configs/$KERNEL_DEFCONFIG \
            --disable ANDROID_SIMPLE_LMK \
            --enable ANDROID_LOW_MEMORY_KILLER

      - name: Restore ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-sdm670-kernel
          max-size: 10G

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio flex git libelf-dev lld \
            libncurses5-dev libssl-dev make rsync unzip zip python3 python-is-python3

      - name: Set up Toolchain
        run: |
          git clone --depth 1 $PROTON_CLANG_REPO .deps/proton-clang

      - name: Set up AnyKernel3
        run: |
          git clone --depth 1 -b r5p $ANYKERNEL_REPO .deps/AnyKernel3

      - name: Integrate KernelSU (hookless)
        run: |
          curl -LSs "$KERNELSU_SETUP" | bash -s $KERNELSU_SETUP_BRANCH
          # setup.sh silently falls back to the default branch when its
          # checkout fails ("Checkout default branch"), so enforce the pin
          # explicitly here. The step fails loudly if this doesn't work.
          cd KernelSU
          git fetch origin "$KERNELSU_SETUP_BRANCH" || git fetch origin
          git checkout "$KERNELSU_SETUP_BRANCH"
          git rev-parse HEAD

      - name: Configure and Build Kernel
        env:
          KERNEL_VERSION: ${{ matrix.variant.kernel_version }}
        run: |
          mkdir -p out

          TC_PATH="${{ github.workspace }}/.deps/proton-clang/bin"
          export HOSTCFLAGS="-Wno-unused-command-line-argument"

          make O=out ARCH=arm64 \
            CC="$TC_PATH/clang" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            $KERNEL_DEFCONFIG

          ./scripts/config --file out/.config \
             --set-str CONFIG_LOCALVERSION "-${KERNEL_NAME}-${KERNEL_VERSION}"

          make O=out ARCH=arm64 \
            CC="$TC_PATH/clang" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_PATH/arm-linux-gnueabi-" \
            olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="ccache $TC_PATH/clang" \
            LD="$TC_PATH/ld.lld" \
            AR="$TC_PATH/llvm-ar" \
            NM="$TC_PATH/llvm-nm" \
            OBJCOPY="$TC_PATH/llvm-objcopy" \
            OBJDUMP="$TC_PATH/llvm-objdump" \
            READELF="$TC_PATH/llvm-readelf" \
            STRIP="$TC_PATH/llvm-strip" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_PATH/arm-linux-gnueabi-" \
            LLVM=1 LLVM_IAS=1

      - name: Package AnyKernel3
        id: package
        env:
          KERNEL_VERSION: ${{ matrix.variant.kernel_version }}
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/$KERNEL_IMAGE artifacts/
          cp out/.config artifacts/kernel.config

          mkdir -p .deps/AnyKernel3_staging
          cp -r .deps/AnyKernel3/* .deps/AnyKernel3_staging/
          cp out/arch/arm64/boot/$KERNEL_IMAGE .deps/AnyKernel3_staging/

          BUILD_DATE=$(date -u +%Y%m%d-%H%M)
          ZIP_NAME="${KERNEL_NAME}-${KERNEL_VERSION}-${KERNEL_VARIANT}-${DEVICE_CODENAME}-${BUILD_DATE}.zip"
          TAG_NAME="${KERNEL_NAME}-${KERNEL_VERSION}-${BUILD_DATE}"

          cd .deps/AnyKernel3_staging
          zip -r9 ../../artifacts/$ZIP_NAME . -x '.git*' 'README.md'
          cd ../..

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-artifacts-${{ matrix.variant.kernel_version }}
          path: artifacts/*

  release:
    name: Publish Release (${{ matrix.variant.kernel_version }})
    needs: build
    # Accept the checkbox from the UI and a string from the API/gh CLI, so a
    # release is published whichever way the run was triggered.
    if: >-
      ${{ (inputs.publish_release == true)
          || (github.event.inputs.publish_release == 'true') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - kernel_version: "ascension-SLMK"
          - kernel_version: "ascension"
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: kernel-build-artifacts-${{ matrix.variant.kernel_version }}
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: Mystralis-${{ matrix.variant.kernel_version }}-${{ github.run_number }}
          name: Mystralis-${{ matrix.variant.kernel_version }}-${{ github.run_number }}
          fail_on_unmatched_files: true
          body: |
            **Mystralis** kernel for Realme 5 Pro (RMX1971, Snapdragon 710, kernel 4.9.337).

            Variant: `${{ matrix.variant.kernel_version }}` (run #${{ github.run_number }})

            | | |
            |---|---|
            | Device | Realme 5 Pro (RMX1971) |
            | SoC | Qualcomm Snapdragon 710 (SDM710) |
            | Kernel | 4.9.337-Mystralis |
            | Defconfig | `sdm670-perf_defconfig` |
            | Toolchain | proton-clang (kdrag0n) |
            | Root | KernelSU (hookless) |

            ### Install
            Flash `*.zip` from the assets via AnyKernel3 from a custom recovery.

            ### Requirements and warnings
            - **Back up your data and stock `boot.img` first.** A kernel flash
              can brick a device, and a bad flash can make userdata
              undecryptable.
            - Built and tested on a **4 GB / 128 GB** unit. Other RAM/storage
              configurations will behave differently.

            ### Known issues
            - A VPN app that fails to tear down cleanly can still leave a
              stale interface behind. The kernel now sweeps unused TUN
              interfaces, but a wedged app may need a reboot.
            - OTA updates are untested and may not work.

            ### Credits
            - dain09 — `android_kernel_realme_sdm710`, AnyKernel3
            - Sultan Alsawaf — Simple LMK
            - backslashxx — KernelSU (hookless)
            - kdrag0n — proton-clang
          files: |
            release/*.zip
            release/kernel.config
