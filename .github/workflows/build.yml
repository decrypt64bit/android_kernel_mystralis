name: Build Mystralis Kernel

on:
  push:
    branches:
      - mystralis
      - mystralis-clean
      - mystralis-mglru
      - mystralis-rxt
      - mystralis-rxt-mglru
      - rebel-5pro
      - rebel-xt
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release after a successful build"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_CODENAME: "RMX1971"
  KERNEL_DEFCONFIG: "sdm670-perf_defconfig"
  KERNEL_IMAGE: "Image.gz-dtb"
  # In-kernel identity. This is what uname and the OS settings show, so it
  # carries no device suffix.
  KERNEL_NAME: "Mystralis"
  # GitHub-facing identity. The branch, the zip and the release tag carry the
  # device so the two devices never publish identical names.
  RELEASE_NAME: "Mystralis-5Pro"
  KERNEL_VARIANT: "mystralis"
  PROTON_CLANG_REPO: "https://github.com/kdrag0n/proton-clang.git"
  ANYKERNEL_REPO: "https://github.com/dain09/AnyKernel3.git"
  # Hookless KSU driver (backslashxx/KernelSU line, KSU_TAMPER_SYSCALL_TABLE,
  # no KPROBES dependency). This is the same repo mystralis-mglru uses, and
  # deliberately NOT dain09/KernelSU: that ref no longer exists upstream, so
  # the old `curl setup.sh | bash` path hard-failed before the compiler and
  # every build on every branch died.
  #
  # 32669 is the newest build-number tag (2026-10-08) and is on the uapi v5
  # line: KERNEL_SU_UAPI_VERSION is 5 here, where the previous pin 32651
  # reported 4. The first tag with uapi v5 is 32664.
  #
  # Manager APK compatibility: a manager built against uapi v4 (such as
  # KernelSU_v3.3.0-52_32653) will not talk to this driver. Flash a manager
  # built against uapi v5 alongside this kernel or root will not work.
  KERNELSU_REPO: "https://github.com/backslashxx/KernelSU"
  KERNELSU_SETUP_BRANCH: 32669
  KBUILD_BUILD_USER: "@decrypt64bit"
  KBUILD_BUILD_HOST: "ubuntu-24.04"

jobs:
  build:
    name: Build Kernel Artifacts (${{ matrix.variant.kernel_version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      # Without this, one variant failing cancels the other, and since the
      # release job needs the whole matrix it would never publish.
      fail-fast: false
      matrix:
        variant:
          - kernel_version: "ascension-SLMK"
          - kernel_version: "ascension"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          # Shallow checkout is enough (no rebase); speeds up CI a lot.
          fetch-depth: 1

      - name: Switch non-SLMK variant to classic LMK
        if: ${{ matrix.variant.kernel_version == 'ascension' }}
        run: |
          # Don't rebase SLMK commits away (conflict-prone); just disable
          # the driver and enable the self-starting classic lowmemorykiller
          # (built-in adj/minfree defaults) so this variant keeps a working LMK.
          ./scripts/config --file arch/arm64/configs/$KERNEL_DEFCONFIG \
            --disable ANDROID_SIMPLE_LMK \
            --enable ANDROID_LOW_MEMORY_KILLER

      - name: Restore ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-sdm670-kernel
          max-size: 10G

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio flex git libelf-dev lld \
            libncurses5-dev libssl-dev make rsync unzip zip python3 python-is-python3

      - name: Set up Toolchain
        run: |
          git clone --depth 1 $PROTON_CLANG_REPO .deps/proton-clang

      - name: Set up AnyKernel3
        run: |
          git clone --depth 1 -b r5p $ANYKERNEL_REPO .deps/AnyKernel3

      - name: Integrate KernelSU (hookless)
        run: |
          set -eu
          # Inline equivalent of kernel/setup.sh, but cloning KERNELSU_REPO
          # instead of the backslashxx URL that script hardcodes.
          git clone --depth 1 -b "$KERNELSU_SETUP_BRANCH" "$KERNELSU_REPO" KernelSU
          git -C KernelSU rev-parse HEAD
          DRIVER_DIR=drivers
          test -d "$DRIVER_DIR" || { echo "no $DRIVER_DIR"; exit 1; }
          ln -sf "$(realpath --relative-to="$DRIVER_DIR" "$GITHUB_WORKSPACE/KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig" || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"
          echo "--- Makefile tail ---"; tail -3 "$DRIVER_DIR/Makefile"
          echo "--- Kconfig around endmenu ---"; grep -n -B1 -A1 'kernelsu' "$DRIVER_DIR/Kconfig"

      - name: Configure and Build Kernel
        env:
          KERNEL_VERSION: ${{ matrix.variant.kernel_version }}
        run: |
          mkdir -p out

          TC_PATH="${{ github.workspace }}/.deps/proton-clang/bin"
          export HOSTCFLAGS="-Wno-unused-command-line-argument"

          make O=out ARCH=arm64 \
            CC="$TC_PATH/clang" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            $KERNEL_DEFCONFIG

          ./scripts/config --file out/.config \
             --set-str CONFIG_LOCALVERSION "-${KERNEL_NAME}-${KERNEL_VERSION}"

          make O=out ARCH=arm64 \
            CC="$TC_PATH/clang" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_PATH/arm-linux-gnueabi-" \
            olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="ccache $TC_PATH/clang" \
            LD="$TC_PATH/ld.lld" \
            AR="$TC_PATH/llvm-ar" \
            NM="$TC_PATH/llvm-nm" \
            OBJCOPY="$TC_PATH/llvm-objcopy" \
            OBJDUMP="$TC_PATH/llvm-objdump" \
            READELF="$TC_PATH/llvm-readelf" \
            STRIP="$TC_PATH/llvm-strip" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_PATH/arm-linux-gnueabi-" \
            LLVM=1 LLVM_IAS=1

      - name: Package AnyKernel3
        id: package
        env:
          KERNEL_VERSION: ${{ matrix.variant.kernel_version }}
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/$KERNEL_IMAGE artifacts/
          cp out/.config artifacts/kernel.config

          mkdir -p .deps/AnyKernel3_staging
          cp -r .deps/AnyKernel3/* .deps/AnyKernel3_staging/
          cp out/arch/arm64/boot/$KERNEL_IMAGE .deps/AnyKernel3_staging/

          BUILD_DATE=$(date -u +%Y%m%d-%H%M)
          ZIP_NAME="${RELEASE_NAME}-${KERNEL_VERSION}-${KERNEL_VARIANT}-${DEVICE_CODENAME}-${BUILD_DATE}.zip"
          TAG_NAME="${RELEASE_NAME}-${KERNEL_VERSION}-${BUILD_DATE}"

          cd .deps/AnyKernel3_staging
          zip -r9 ../../artifacts/$ZIP_NAME . -x '.git*' 'README.md'
          cd ../..

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-artifacts-${{ matrix.variant.kernel_version }}
          path: artifacts/*

  release:
    name: Publish Release
    needs: build
    if: >-
      ${{ (inputs.publish_release == true)
          || (github.event.inputs.publish_release == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Compute release tag
        id: tag
        run: |
          TAG="Mystralis-Rebel-$(date -u +%Y-%m-%d)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Clean old assets from today's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # If the release already exists, delete assets whose names match
          # this branch's RELEASE_NAME so a same-day rebuild replaces them.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists, cleaning old assets from this branch..."
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | \
              grep "^${RELEASE_NAME}-" | while read -r asset; do
                echo "  deleting $asset"
                gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes || true
              done
          else
            echo "Release $TAG does not exist yet, will be created."
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Mystralis/Rebel ${{ steps.tag.outputs.tag }}
          body: ""
          fail_on_unmatched_files: false
          files: |
            release/*.zip
