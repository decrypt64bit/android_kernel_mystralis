name: Build Rebel MGLRU Kernel

on:
  push:
    branches:
      - mystralis
      - mystralis-clean
      - mystralis-mglru
      - mystralis-rxt
      - mystralis-rxt-mglru
      - rebel-5pro
      - rebel-5pro-mglru
      - rebel-xt
      - rebel-xt-mglru
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release after a successful build"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_CODENAME: "RMX1971"
  KERNEL_DEFCONFIG: "sdm670-perf_defconfig"
  KERNEL_IMAGE: "Image.gz-dtb"
  # In-kernel identity: uname and OS settings, no device suffix.
  KERNEL_NAME: "Rebel-mglru"
  # GitHub-facing identity: branch, zip and release tag carry the device.
  RELEASE_NAME: "Rebel-mglru-5Pro"
  KERNEL_VARIANT: "rebel-mglru"
  PROTON_CLANG_REPO: "https://github.com/kdrag0n/proton-clang.git"
  ANYKERNEL_REPO: "https://github.com/dain09/AnyKernel3.git"
  # KernelSU-Next (legacy branch). Pinned to the legacy branch HEAD so we
  # always get the latest driver. KSU_MANUAL_HOOK is set in the defconfig;
  # the kprobes and syscall-table hooks are both incompatible with 4.9.
  KERNELSU_REPO: "https://github.com/KernelSU-Next/KernelSU-Next"
  KERNELSU_SETUP_BRANCH: legacy
  KBUILD_BUILD_USER: "@decrypt64bit"
  KBUILD_BUILD_HOST: "ubuntu-24.04"

jobs:
  build:
    name: Build Kernel Artifacts (${{ matrix.variant.kernel_version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      # Without this, one variant failing cancels the other, and since the
      # release job needs the whole matrix it would never publish.
      fail-fast: false
      matrix:
        variant:
          - kernel_version: "Aetheris-SLMK"
          - kernel_version: "Aetheris"
          # Boot-diagnostic control: same SLMK policy, with only MGLRU off.
          - kernel_version: "Aetheris-SLMK-noMGLRU"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          # Shallow checkout is enough (no rebase); speeds up CI a lot.
          fetch-depth: 1

      - name: Switch non-SLMK variant to classic LMK
        if: ${{ matrix.variant.kernel_version == 'Aetheris' }}
        run: |
          # The rebase this replaced could not replay on the current tree and
          # needs full history, which conflicts with the shallow checkout.
          # Switch the defconfig instead: same result, no history rewriting.
          ./scripts/config --file arch/arm64/configs/$KERNEL_DEFCONFIG \
            --disable ANDROID_SIMPLE_LMK \
            --enable ANDROID_LOW_MEMORY_KILLER

      - name: Restore ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-sdm670-kernel
          max-size: 10G

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio flex git libelf-dev lld \
            libncurses5-dev libssl-dev make rsync unzip zip python3 python-is-python3

      - name: Set up Toolchain
        run: |
          git clone --depth 1 $PROTON_CLANG_REPO .deps/proton-clang

      - name: Set up AnyKernel3
        run: |
          git clone --depth 1 -b r5p $ANYKERNEL_REPO .deps/AnyKernel3

      - name: Integrate KernelSU-Next (legacy)
        run: |
          set -eu
          git clone --depth 1 -b "$KERNELSU_SETUP_BRANCH" "$KERNELSU_REPO" KernelSU-Next
          git -C KernelSU-Next rev-parse HEAD
          DRIVER_DIR=drivers
          test -d "$DRIVER_DIR" || { echo "no $DRIVER_DIR"; exit 1; }
          ln -sf "$(realpath --relative-to="$DRIVER_DIR" "$GITHUB_WORKSPACE/KernelSU-Next/kernel")" "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig" || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"
          echo "--- Makefile tail ---"; tail -3 "$DRIVER_DIR/Makefile"
          echo "--- Kconfig around endmenu ---"; grep -n -B1 -A1 'kernelsu' "$DRIVER_DIR/Kconfig"

          # Backport headers for 4.9.
          #
          # KSUN's tree targets Linux 5.9+ and includes headers that were
          # split out of older ones after 4.9:
          #   compiler_types.h                  -> split out of compiler.h
          #   sched/signal.h, sched/task_stack.h,
          #   sched/types.h, sched/user.h       -> split out of sched.h
          #   pgtable.h                         -> arch specific, use asm/
          #   hex.h                             -> include is unused, drop it
          #   uapi/linux/sched/types.h          -> split out of uapi/linux/sched.h
          #
          # linux/sched/task.h is left alone: this kernel already has it.
          # linux/version.h needs no change: the kernel Makefile generates it
          # from VERSION/PATCHLEVEL, so LINUX_VERSION_CODE is available.
          find KernelSU-Next/kernel -name '*.[ch]' -exec sed -i \
            -e 's|<linux/compiler_types\.h>|<linux/compiler.h>|g' \
            -e 's|<linux/sched/signal\.h>|<linux/sched.h>|g' \
            -e 's|<linux/sched/task_stack\.h>|<linux/sched.h>|g' \
            -e 's|<linux/sched/types\.h>|<linux/sched.h>|g' \
            -e 's|<linux/sched/user\.h>|<linux/sched.h>|g' \
            -e 's|<uapi/linux/sched/types\.h>|<uapi/linux/sched.h>|g' \
            -e 's|<linux/pgtable\.h>|<asm/pgtable.h>|g' \
            -e '/#include <linux\/hex\.h>/d' {} +

          # Fail loudly if any include that does not exist on 4.9 survived.
          if grep -rEn 'linux/(compiler_types|hex|pgtable)\.h|linux/sched/(signal|task_stack|types|user)\.h|uapi/linux/sched/types\.h' \
               KernelSU-Next/kernel --include='*.c' --include='*.h'; then
            echo "::error::headers missing on 4.9 remain in the KSUN tree"
            exit 1
          fi
          echo "KSUN 4.9 header backport: clean"

      - name: Configure and Build Kernel
        env:
          KERNEL_VERSION: ${{ matrix.variant.kernel_version }}
        run: |
          mkdir -p out

          TC_PATH="${{ github.workspace }}/.deps/proton-clang/bin"
          export HOSTCFLAGS="-Wno-unused-command-line-argument"

          make O=out ARCH=arm64 \
            CC="$TC_PATH/clang" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            $KERNEL_DEFCONFIG

          if [ "$KERNEL_VERSION" = "Aetheris-SLMK-noMGLRU" ]; then
            ./scripts/config --file out/.config --disable LRU_GEN
          fi

          ./scripts/config --file out/.config \
             --set-str CONFIG_LOCALVERSION "-${KERNEL_NAME}-${KERNEL_VERSION}"

          make O=out ARCH=arm64 \
            CC="$TC_PATH/clang" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_PATH/arm-linux-gnueabi-" \
            olddefconfig

          if [ "$KERNEL_VERSION" = "Aetheris-SLMK-noMGLRU" ]; then
            grep -qx '# CONFIG_LRU_GEN is not set' out/.config || {
              echo "MGLRU control variant must have CONFIG_LRU_GEN disabled" >&2
              exit 1
            }
          else
            grep -qx 'CONFIG_LRU_GEN=y' out/.config || {
              echo "CONFIG_LRU_GEN must be enabled in the normal variants" >&2
              exit 1
            }
          fi
          if [ "$KERNEL_VERSION" = "Aetheris-SLMK" ] || \
             [ "$KERNEL_VERSION" = "Aetheris-SLMK-noMGLRU" ]; then
            grep -qx 'CONFIG_ANDROID_SIMPLE_LMK=y' out/.config || {
              echo "Simple LMK variant unexpectedly disabled" >&2
              exit 1
            }
          else
            grep -qx 'CONFIG_ANDROID_LOW_MEMORY_KILLER=y' out/.config || {
              echo "Classic LMK diagnostic variant unexpectedly disabled" >&2
              exit 1
            }
          fi

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="ccache $TC_PATH/clang" \
            LD="$TC_PATH/ld.lld" \
            AR="$TC_PATH/llvm-ar" \
            NM="$TC_PATH/llvm-nm" \
            OBJCOPY="$TC_PATH/llvm-objcopy" \
            OBJDUMP="$TC_PATH/llvm-objdump" \
            READELF="$TC_PATH/llvm-readelf" \
            STRIP="$TC_PATH/llvm-strip" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_PATH/arm-linux-gnueabi-" \
            LLVM=1 LLVM_IAS=1

      - name: Package AnyKernel3
        id: package
        env:
          KERNEL_VERSION: ${{ matrix.variant.kernel_version }}
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/$KERNEL_IMAGE artifacts/
          cp out/.config artifacts/kernel.config

          mkdir -p .deps/AnyKernel3_staging
          cp -r .deps/AnyKernel3/* .deps/AnyKernel3_staging/
          cp out/arch/arm64/boot/$KERNEL_IMAGE .deps/AnyKernel3_staging/

          BUILD_DATE=$(date -u +%Y%m%d-%H%M)
          ZIP_NAME="${RELEASE_NAME}-${KERNEL_VERSION}-${KERNEL_VARIANT}-${DEVICE_CODENAME}-${BUILD_DATE}.zip"
          TAG_NAME="${RELEASE_NAME}-${KERNEL_VERSION}-${BUILD_DATE}"

          cd .deps/AnyKernel3_staging
          zip -r9 ../../artifacts/$ZIP_NAME . -x '.git*' 'README.md'
          cd ../..

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-artifacts-${{ matrix.variant.kernel_version }}
          path: artifacts/*

  release:
    name: Publish Release
    needs: build
    concurrency:
      group: publish-release
      cancel-in-progress: false
    if: >-
      ${{ (inputs.publish_release == true)
          || (github.event.inputs.publish_release == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Compute release tag
        id: tag
        run: |
          TAG="Mystralis-Rebel-$(date -u +%Y-%m-%d)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Clean old assets from today's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # If the release already exists, delete assets whose names match
          # this branch's RELEASE_NAME so a same-day rebuild replaces them.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists, cleaning old assets from this branch..."
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | \
              grep "^${RELEASE_NAME}-" | while read -r asset; do
                echo "  deleting $asset"
                gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes || true
              done
          else
            echo "Release $TAG does not exist yet, will be created."
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Mystralis/Rebel ${{ steps.tag.outputs.tag }}
          body: ""
          fail_on_unmatched_files: false
          files: |
            release/*.zip
